<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Background Music Maker</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f2f7f4;
    color: #222;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
    color: #0b5d3b;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin: 18px 0 8px;
}

.upload-box {
    background: #f5f9f6;
    border: 2px dashed #0b5d3b;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
}

.upload-box input[type="file"] {
    width: 100%;
    font-size: 15px;
}

.upload-help {
    margin-top: 10px;
    font-size: 13px;
    color: #666;
}

.file-name {
    margin-top: 12px;
    font-weight: bold;
    color: #0b5d3b;
    word-break: break-word;
}

audio {
    width: 100%;
    margin-top: 12px;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 15px;
    border: none;
    border-radius: 9px;
    background: #0b5d3b;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #08482f;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.secondary {
    background: #555;
}

.status {
    margin-top: 18px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    background: #e8f5ec;
    color: #0b5d3b;
    font-weight: bold;
    line-height: 1.5;
}

.result-box {
    margin-top: 25px;
    padding: 18px;
    border-radius: 10px;
    background: #f5f9f6;
    border: 1px solid #cbded3;
    display: none;
}

.result-title {
    color: #0b5d3b;
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 10px;
}

.download-button {
    background: #1769aa;
}

.download-button:hover {
    background: #0d4f80;
}

footer {
    text-align: center;
    margin-top: 25px;
    color: #666;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎼 Background Music Maker</h1>

<div class="subtitle">
Remove vocals and create instrumental music
</div>

<label for="songFile">
🎵 Upload Song / Music
</label>

<div class="upload-box">

<input
    type="file"
    id="songFile"
    accept="audio/*"
>

<div class="upload-help">
Select an MP3, WAV, M4A or other audio file.
</div>

<div class="file-name" id="songName">
No song selected
</div>

<audio
    id="originalPlayer"
    controls
    style="display:none;">
</audio>

</div>

<button id="separateButton" disabled>
🎼 Separate Background Music
</button>

<button
    id="stopButton"
    class="secondary"
    style="display:none;">
⏹ Stop
</button>

<div class="status" id="status">
Please upload a song first.
</div>

<div class="result-box" id="resultBox">

<div class="result-title">
🎼 Background Music / Instrumental
</div>

<audio
    id="instrumentalPlayer"
    controls>
</audio>

<button
    id="downloadButton"
    class="download-button">
⬇️ Download Background Music
</button>

</div>

<footer>
Sindhi Urdu Vocal Maker © 2026
</footer>

</div>

<script>

/* =====================================
   CLOUDFLARE WORKER
===================================== */

const WORKER_URL =
"https://background-music-separator.shahbazdeedar555.workers.dev/";


/* =====================================
   ELEMENTS
===================================== */

const songFile =
document.getElementById("songFile");

const songName =
document.getElementById("songName");

const originalPlayer =
document.getElementById("originalPlayer");

const separateButton =
document.getElementById("separateButton");

const stopButton =
document.getElementById("stopButton");

const status =
document.getElementById("status");

const resultBox =
document.getElementById("resultBox");

const instrumentalPlayer =
document.getElementById("instrumentalPlayer");

const downloadButton =
document.getElementById("downloadButton");


let songURL = null;
let instrumentalURL = null;


/* =====================================
   SONG UPLOAD
===================================== */

songFile.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {
        return;
    }

    if (!file.type.startsWith("audio/")) {

        status.textContent =
        "⚠️ Please select an audio file.";

        songFile.value = "";

        separateButton.disabled = true;

        return;
    }

    if (songURL) {
        URL.revokeObjectURL(songURL);
    }

    songURL =
    URL.createObjectURL(file);

    songName.textContent =
    "🎵 " + file.name;

    originalPlayer.src =
    songURL;

    originalPlayer.style.display =
    "block";

    separateButton.disabled =
    false;

    resultBox.style.display =
    "none";

    instrumentalPlayer.removeAttribute("src");

    status.textContent =
    "✅ Song uploaded. Ready to separate background music.";

});


/* =====================================
   ORIGINAL SONG PLAY
===================================== */

originalPlayer.addEventListener("play", function () {

    stopButton.style.display =
    "block";

    status.textContent =
    "🎵 Original song is playing...";

});


/* =====================================
   ORIGINAL SONG PAUSE
===================================== */

originalPlayer.addEventListener("pause", function () {

    if (!originalPlayer.ended) {

        status.textContent =
        "Original song paused.";

    }

});


/* =====================================
   STOP
===================================== */

stopButton.addEventListener("click", function () {

    originalPlayer.pause();

    instrumentalPlayer.pause();

    originalPlayer.currentTime =
    0;

    instrumentalPlayer.currentTime =
    0;

    stopButton.style.display =
    "none";

    status.textContent =
    "Playback stopped.";

});


/* =====================================
   SEPARATE BACKGROUND MUSIC
===================================== */

separateButton.addEventListener("click", async function () {

    const file =
    songFile.files[0];

    if (!file) {

        status.textContent =
        "⚠️ Please upload a song first.";

        return;
    }

    separateButton.disabled =
    true;

    separateButton.textContent =
    "⏳ Processing...";

    status.textContent =
    "🎼 Sending audio to separation engine...";

    try {

        const formData =
        new FormData();

        formData.append(
            "file",
            file
        );


        const response =
        await fetch(
            WORKER_URL,
            {
                method: "POST",
                body: formData
            }
        );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const blob =
        await response.blob();


        if (instrumentalURL) {

            URL.revokeObjectURL(
                instrumentalURL
            );

        }


        instrumentalURL =
        URL.createObjectURL(blob);


        instrumentalPlayer.src =
        instrumentalURL;


        resultBox.style.display =
        "block";


        status.textContent =
        "✅ Background music is ready!";


    } catch (error) {

        console.error(error);

        status.textContent =
        "❌ Separation failed. Please try again.";

    }


    separateButton.disabled =
    false;

    separateButton.textContent =
    "🎼 Separate Background Music";

});


/* =====================================
   DOWNLOAD
===================================== */

downloadButton.addEventListener("click", function () {

    if (!instrumentalURL) {

        status.textContent =
        "⚠️ No background music file is available yet.";

        return;
    }


    const link =
    document.createElement("a");


    link.href =
    instrumentalURL;


    link.download =
    "background-music.mp3";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

});


/* =====================================
   CLEANUP
===================================== */

window.addEventListener(
"beforeunload",
function () {

    if (songURL) {

        URL.revokeObjectURL(
            songURL
        );

    }

    if (instrumentalURL) {

        URL.revokeObjectURL(
            instrumentalURL
        );

    }

});

</script>

</body>
</html>
